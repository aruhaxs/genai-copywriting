<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — AI Studio & Auto Post IG</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1; --primary-hover: #4f46e5; --secondary: #ec4899;
            --bg-color: #f8fafc; --card-bg: #ffffff; --text-main: #0f172a;
            --text-muted: #64748b; --border: #e2e8f0;
            --shadow-lg: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; min-height: 100vh; padding: 20px;
            background: linear-gradient(135deg, #f0f9ff 0%, #e0e7ff 100%); color: var(--text-main);
            display: flex; align-items: center; justify-content: center;
        }
        .card {
            background: var(--card-bg); width: 100%; max-width: 400px; padding: 40px 36px;
            border-radius: 24px; box-shadow: var(--shadow-lg);
        }
        .back-link { font-size: 13px; color: var(--text-muted); text-decoration: none; font-weight: 600; }
        .back-link:hover { color: var(--primary); }
        h1 {
            font-size: 26px; font-weight: 800; margin: 16px 0 6px 0; letter-spacing: -0.5px;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        p.subtitle { color: var(--text-muted); font-size: 14px; margin: 0 0 26px 0; }

        .msg { padding: 12px 14px; border-radius: 10px; font-size: 13.5px; font-weight: 600; margin-bottom: 10px; }
        .msg.error { background: #fee2e2; color: #b91c1c; }
        .msg.success { background: #dcfce7; color: #15803d; }
        .msg.warning { background: #fef9c3; color: #a16207; }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 7px; font-size: 13px; font-weight: 600; color: #334155; }
        .form-group input {
            width: 100%; padding: 12px 16px; border: 1px solid #cbd5e1; border-radius: 10px;
            box-sizing: border-box; font-family: inherit; font-size: 14px; background: white; transition: all 0.3s;
        }
        .form-group input:focus {
            outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%); color: white;
            border: none; padding: 15px; width: 100%; border-radius: 12px; font-size: 15px; font-weight: 700;
            cursor: pointer; transition: all 0.3s; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); margin-top: 6px;
        }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(99, 102, 241, 0.4); }

        .switch-link { text-align: center; font-size: 13.5px; color: var(--text-muted); margin-top: 22px; }
        .switch-link a { color: var(--primary); font-weight: 700; text-decoration: none; }
        .switch-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <a href="{% url 'home' %}" class="back-link">&larr; Kembali ke Beranda</a>
        <h1>Selamat Datang Kembali</h1>
        <p class="subtitle">Login untuk melanjutkan ke dashboard Anda.</p>

        {% if messages %}
            {% for message in messages %}
                <div class="msg {{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="post" novalidate>
            {% csrf_token %}
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" value="{{ email|default:'' }}" placeholder="nama@email.com" required autofocus>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Password Anda" required>
            </div>

            <button type="submit" class="btn-submit">Login</button>
        </form>

        <div class="switch-link">
            Belum punya akun? <a href="{% url 'signup' %}">Sign Up di sini</a>
        </div>
    </div>
</body>
</html>
